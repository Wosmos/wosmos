name: Metrics
on:
  # Refresh daily and on manual trigger
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # Uses a personal token if you add one (secret METRICS_TOKEN),
          # otherwise falls back to the built-in Actions token — no setup needed.
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Wosmos
          filename: metrics.svg
          template: classic
          # Keep only what the built-in Actions token can serve. Languages and
          # habits need cross-repo access — enabled automatically once a
          # METRICS_TOKEN secret (a personal token) is present.
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          plugin_isocalendar: ${{ secrets.METRICS_TOKEN != '' }}
          plugin_isocalendar_duration: full-year
          plugin_languages: ${{ secrets.METRICS_TOKEN != '' }}
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_habits: ${{ secrets.METRICS_TOKEN != '' }}
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
